<eform-new-subheader [forceStaticTitle]="true" [title]="'Page not found' | translate"></eform-new-subheader>
<div id="notFoundPage" class="d-flex flex-column align-items-start gap-12">
  <p class="m-0">{{ 'No page exists at this address' | translate }}: <code id="notFoundUrl">{{ requestedUrl }}</code></p>
  <button class="btn-primary" id="notFoundHomeBtn" (click)="goToStartPage()">{{ 'Go to the start page' | translate }}</button>
</div>
