<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>eForm Backend</title>
  <base href="/">

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="shortcut icon" sizes="152x152" href="/assets/158.png"/>
  <link rel="apple-touch-icon" sizes="152x152" href="/assets/158.png"/>
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,500,0,0" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Sharp:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script>
    // Paints the saved appearance before Angular boots. Always leaves exactly one of theme-light / theme-dark on <body>.
    (function () {
      var mode = 'system';
      try {
        var stored = window.localStorage.getItem('theme-mode');
        if (stored === 'light' || stored === 'dark') { mode = stored; }
      } catch (e) { /* blocked storage: follow the OS */ }
      var cls = mode === 'dark' ? 'theme-dark' : 'theme-light';
      if (mode === 'system') {
        try {
          if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) { cls = 'theme-dark'; }
        } catch (e) { /* no matchMedia: light */ }
      }
      function paint() {
        var b = document.body;
        if (!b) { return false; }
        b.classList.remove('theme-light', 'theme-dark');
        b.classList.add(cls);
        return true;
      }
      if (!paint()) {
        // <body> does not exist yet while <head> is parsed; paint it the moment it is created
        try {
          var observer = new MutationObserver(function () { if (paint()) { observer.disconnect(); } });
          observer.observe(document.documentElement, {childList: true});
        } catch (e) { /* DOMContentLoaded below still covers it */ }
        document.addEventListener('DOMContentLoaded', function () {
          var b = document.body;
          if (b && !b.classList.contains('theme-light') && !b.classList.contains('theme-dark')) { paint(); }
        });
      }
    })();
  </script>
</head>
<body class="mat-typography mat-app-background">
  <app-root>
  </app-root>
</body>
</html>
